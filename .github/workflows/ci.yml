name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build first: Next generates .next/types, without which tsc fails on
      # its own globals (LayoutProps, PageProps).
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
